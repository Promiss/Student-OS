		<script>
		$(document).ready(function() {
			// 获取密码输入框
			const $password = $('#input_password');
			const $confirmPassword = $('#confirm_password');
			const $submitBtn = $('#signup_submit');
			
			// 添加密码输入框的验证状态提示
			$password.after('<div class="password-strength"></div>');
			$confirmPassword.after('<div class="password-match"></div>');
			
			// 修改验证密码强度和一致性函数
			function validatePasswords() {
				const password = $password.val();
				const confirmPassword = $confirmPassword.val();
				let isValid = true;
				
				// 清除之前的验证状态
				$password.removeClass('signup-input-error signup-input-success');
				$confirmPassword.removeClass('signup-input-error signup-input-success');
				$('.password-strength, .password-match').removeClass('signup-error-text signup-success-text');
				
				// 验证密码强度
				if (password) {
					const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$/;
					if (!strongRegex.test(password)) {
						$password.addClass('signup-input-error');
						$('.password-strength')
							.text('密码至少8位，包含大小写字母和数字')
							.addClass('signup-error-text')
							.fadeIn(200);  // 显示错误提示
						isValid = false;
					} else {
						$password.addClass('signup-input-success');
						$('.password-strength')
							.text('密码强度符合要求')
							.addClass('signup-success-text')
							.fadeOut(1000);  // 1秒后隐藏成功提示
					}
				}
				
				// 验证密码一致性
				if (confirmPassword) {
					if (password !== confirmPassword) {
						$confirmPassword.addClass('signup-input-error');
						$('.password-match')
							.text('两次输入的密码不一致')
							.addClass('signup-error-text')
							.fadeIn(200);  // 显示错误提示
						isValid = false;
					} else {
						$confirmPassword.addClass('signup-input-success');
						$('.password-match')
							.text('密码输入一致')
							.addClass('signup-success-text')
							.fadeOut(1000);  // 1秒后隐藏成功提示
					}
				}
				
				// 更新提交按钮状态
				$submitBtn.prop('disabled', !isValid);
				return isValid;
			}
			
			// 修改绑定输入事件的逻辑
			let validateTimer;
			$password.add($confirmPassword).on('input', function() {
				// 清除之前的定时器
				clearTimeout(validateTimer);
				
				// 显示相应的提示框
				const $input = $(this);
				if ($input.is($password)) {
					$('.password-strength').stop(true, true).fadeIn(200);
				} else {
					$('.password-match').stop(true, true).fadeIn(200);
				}
				
				// 设置新的验证定时器
				validateTimer = setTimeout(validatePasswords, 500);
			});
			
			// 表单提交验证
			$('#signup_form').on('submit', function(e) {
				if (!validatePasswords()) {
					e.preventDefault();
				}
			});
		});
		</script>
